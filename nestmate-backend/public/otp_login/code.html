<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login with Phone - NestMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">

  <div class="glass w-full max-w-md rounded-2xl shadow-xl p-8 relative overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-indigo-500 opacity-10"></div>
    <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 rounded-full bg-blue-500 opacity-10"></div>

    <div class="text-center mb-8 relative z-10">
      <h1 class="text-3xl font-bold text-indigo-600 mb-2">NestMate</h1>
      <p class="text-gray-500 text-sm">Sign in to find your perfect student home</p>
    </div>

    <!-- Step 1: Phone Input -->
    <div id="step-1" class="space-y-6 relative z-10">
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 font-medium">+91</span>
          <input type="tel" id="phone" placeholder="9876543210" class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" required>
        </div>
      </div>
      <button id="send-otp-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors duration-200 shadow-md flex justify-center items-center">
        <span>Send OTP</span>
      </button>
      <div id="error-msg-1" class="text-red-500 text-sm text-center hidden"></div>
      
      <div class="mt-6 text-center text-sm text-gray-500">
        Prefer email? <a href="/nestmate_home_refined/code.html" class="text-indigo-600 hover:underline">Go back to home</a>
      </div>
    </div>

    <!-- Step 2: OTP Input (Hidden initially) -->
    <div id="step-2" class="space-y-6 relative z-10 hidden">
      <div class="text-center">
        <p class="text-sm text-gray-600 mb-1">We sent a 6-digit code to</p>
        <p id="display-phone" class="font-medium text-indigo-700">+91 **********</p>
      </div>

      <div>
        <label for="otp" class="block text-sm font-medium text-gray-700 mb-1">Enter OTP</label>
        <input type="text" id="otp" maxlength="6" placeholder="000000" class="w-full px-4 py-3 text-center text-2xl tracking-[0.5em] rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" required>
      </div>

      <button id="verify-otp-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors duration-200 shadow-md flex justify-center items-center">
        <span>Verify & Login</span>
      </button>
      <div id="error-msg-2" class="text-red-500 text-sm text-center hidden"></div>

      <div class="text-center mt-4 text-sm">
        <p class="text-gray-500" id="timer-text">Resend code in <span id="timer" class="font-bold text-indigo-600">60</span>s</p>
        <button id="resend-btn" class="text-indigo-600 font-medium hover:underline hidden">Resend OTP</button>
      </div>
      <div class="text-center mt-2">
        <button id="change-phone-btn" class="text-sm text-gray-500 hover:text-gray-700 underline">Change phone number</button>
      </div>
    </div>

  </div>

  <script>
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const errorMsg1 = document.getElementById('error-msg-1');
    const errorMsg2 = document.getElementById('error-msg-2');
    const displayPhone = document.getElementById('display-phone');
    const timerSpan = document.getElementById('timer');
    const timerText = document.getElementById('timer-text');
    const resendBtn = document.getElementById('resend-btn');
    const changePhoneBtn = document.getElementById('change-phone-btn');

    let currentPhone = '';
    let countdown;

    function formatPhone(p) {
      // In a real app, you'd validate better. For demo, prepend +91 if length is 10.
      if (p.length === 10) return '+91' + p;
      return p;
    }

    function startTimer() {
      let timeLeft = 60;
      timerText.classList.remove('hidden');
      resendBtn.classList.add('hidden');
      timerSpan.textContent = timeLeft;

      clearInterval(countdown);
      countdown = setInterval(() => {
        timeLeft--;
        timerSpan.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerText.classList.add('hidden');
          resendBtn.classList.remove('hidden');
        }
      }, 1000);
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function hideError(el) {
      el.classList.add('hidden');
    }

    sendOtpBtn.addEventListener('click', async () => {
      const p = phoneInput.value.trim();
      if (!p || p.length < 10) {
        return showError(errorMsg1, 'Please enter a valid phone number');
      }
      
      hideError(errorMsg1);
      sendOtpBtn.disabled = true;
      sendOtpBtn.innerHTML = '<span class="animate-pulse">Sending...</span>';
      
      currentPhone = formatPhone(p);

      try {
        const res = await fetch('/api/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone })
        });
        
        const data = await res.json();
        if (res.ok) {
          step1.classList.add('hidden');
          step2.classList.remove('hidden');
          displayPhone.textContent = currentPhone;
          startTimer();
        } else {
          showError(errorMsg1, data.error || 'Failed to send OTP');
        }
      } catch (err) {
        showError(errorMsg1, 'Network error. Please try again.');
      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = '<span>Send OTP</span>';
      }
    });

    verifyOtpBtn.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      if (otp.length !== 6) {
        return showError(errorMsg2, 'Please enter a 6-digit OTP');
      }

      hideError(errorMsg2);
      verifyOtpBtn.disabled = true;
      verifyOtpBtn.innerHTML = '<span class="animate-pulse">Verifying...</span>';

      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone, otp })
        });
        
        const data = await res.json();
        if (res.ok) {
          if (data.isNewUser) {
            window.location.href = '/complete_profile/code.html';
          } else {
            // Redirect based on role
            if (data.user.role === 'admin') {
              window.location.href = '/admin_panel_nestmate_refined/code.html';
            } else if (data.user.role === 'owner') {
              window.location.href = '/owner_dashboard_nestmate/code.html';
            } else {
              window.location.href = '/browse_listings_nestmate_refined/code.html';
            }
          }
        } else {
          showError(errorMsg2, data.error || 'Invalid OTP');
        }
      } catch (err) {
        showError(errorMsg2, 'Network error. Please try again.');
      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.innerHTML = '<span>Verify & Login</span>';
      }
    });

    resendBtn.addEventListener('click', () => {
      sendOtpBtn.click(); // Re-trigger send OTP
    });

    changePhoneBtn.addEventListener('click', () => {
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
      clearInterval(countdown);
    });

  </script>
</body>
</html>
